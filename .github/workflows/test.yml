name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build and run development container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            make test
            make promu
            make check_license
